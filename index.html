<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawa Sahayak — pharmacy stock assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Serif+Devanagari:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#152A20; --ink2:#4F6558;
  --paper:#EFE9D8; --panel:#FFFDF6; --panel2:#F1EAD4;
  --line:#DDD3B5; --line2:#E8E1C9;
  --brand:#1F5E45; --brandDark:#123B2A; --brandInk:#EAF3EC;
  --marigold:#D98E1B; --marigoldDark:#B4750F; --marigoldS:#F7E3BB;
  --rust:#AE3B2E; --rustS:#F3D9D2;
  --good:#1F5E45; --goodS:#DCEAE0;
  --shadow:rgba(20,40,30,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEAD9; --ink2:#AEB6A8;
    --paper:#101B14; --panel:#17241C; --panel2:#1D2B21;
    --line:#2B3A2F; --line2:#233024;
    --marigold:#E4A53B; --marigoldDark:#F0B854; --marigoldS:#3A2C12;
    --rust:#D97764; --rustS:#3A1E19;
    --good:#3FA37A; --goodS:#16281F;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ink:#EDEAD9; --ink2:#AEB6A8;
  --paper:#101B14; --panel:#17241C; --panel2:#1D2B21;
  --line:#2B3A2F; --line2:#233024;
  --marigold:#E4A53B; --marigoldDark:#F0B854; --marigoldS:#3A2C12;
  --rust:#D97764; --rustS:#3A1E19;
  --good:#3FA37A; --goodS:#16281F;
  --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans Devanagari",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15.5px; line-height:1.55; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:"Fraunces","Noto Serif Devanagari",Georgia,serif}
p{margin:.4em 0}
.wrap{max-width:720px;margin:0 auto;padding:0 0 74px}
.inner{padding:0 18px}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}

/* ---------------- masthead ---------------- */
.masthead{
  background:
    linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.08) 100%),
    repeating-linear-gradient(115deg, transparent 0 38px, rgba(234,243,236,.05) 38px 39px),
    var(--brandDark);
  background-color:var(--brand);
  color:var(--brandInk);
  padding:22px 18px 20px;
  border-bottom:3px solid var(--marigold);
}
.mrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;width:34px;height:34px}
.brand h1{font-size:24px;font-weight:700;margin:0;letter-spacing:.01em;color:var(--brandInk)}
.brand h1 em{font-style:italic;font-weight:500;opacity:.92}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--marigold);color:#241a05;margin-left:9px;vertical-align:2px;white-space:nowrap}
.tagline{font-size:13.5px;color:var(--brandInk);opacity:.88;margin:9px 0 0;max-width:44ch}
.seg{display:inline-flex;border:1px solid rgba(234,243,236,.4);border-radius:20px;overflow:hidden;background:rgba(0,0,0,.12)}
.seg button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;background:transparent;color:var(--brandInk);border:0;cursor:pointer;opacity:.75}
.seg button[aria-pressed=true]{background:var(--marigold);color:#241a05;opacity:1}

/* ---------------- sections ---------------- */
section{margin-top:22px}
.shead{padding:0 18px;margin-bottom:9px}
.shead h2{font-size:19px;font-weight:600;margin:0 0 3px;color:var(--ink)}
.shead .sub{color:var(--ink2);font-size:13px;max-width:52ch}

.ledger{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ledger .inner{padding:2px 18px 4px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--line2);border-left:3px solid transparent;padding-left:10px;margin-left:-10px}
.row:last-child{border-bottom:0}
.row.st-urgent{border-left-color:var(--rust)}
.row.st-soon{border-left-color:var(--marigold)}
.row.st-hold{border-left-color:var(--good)}
.row.st-over{border-left-color:var(--line)}
.row .nm{font-weight:600;font-size:15.5px;font-family:"Fraunces","Noto Serif Devanagari",serif}
.row .meta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.qty{font-family:"Fraunces","Noto Serif Devanagari",serif;font-weight:700;font-size:18px;text-align:right;white-space:nowrap}
.qty small{display:block;font-family:"IBM Plex Sans";font-weight:500;font-size:11.5px;color:var(--ink2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;margin-right:6px}
.pill.urgent{background:var(--rustS);color:var(--rust)}
.pill.soon{background:var(--marigoldS);color:var(--marigoldDark)}
.pill.hold{background:var(--goodS);color:var(--good)}
.pill.disc{background:var(--marigoldS);color:var(--marigoldDark)}

.totband{display:flex;justify-content:space-between;align-items:baseline;background:var(--marigoldS);
  margin:0 -18px;padding:12px 18px;border-top:1px solid var(--line)}
.totband .lab{font-size:13px;color:var(--ink2);font-weight:600}
.totband .val{font-family:"Fraunces","Noto Serif Devanagari",serif;font-weight:700;font-size:21px;color:var(--marigoldDark)}
.muted{color:var(--ink2);font-size:13px;padding:14px 0}

.actions{padding:14px 18px 4px;background:var(--panel)}
.btn{font:inherit;font-size:14.5px;font-weight:600;padding:10px 16px;border-radius:22px;border:1.5px solid var(--ink);
     background:var(--ink);color:var(--panel);cursor:pointer;min-height:44px}
.btn.gold{background:var(--marigold);border-color:var(--marigoldDark);color:#241a05}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
button{font-family:inherit}

.callout{margin:10px 18px 16px;padding:13px 15px 13px 17px;background:var(--panel2);border-left:3px solid var(--marigold);
  border-radius:2px;font-size:14.5px;white-space:pre-wrap;position:relative}
.callout:empty{display:none;margin:0;padding:0;border:0}
.callout.err{border-left-color:var(--rust);color:var(--rust)}

.expmark{width:44px;height:44px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;font-family:"Fraunces","Noto Serif Devanagari",serif;
  font-weight:700;font-size:14px;line-height:1.1;text-align:center;color:var(--ink2)}
.exprow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2)}
.exprow:last-child{border-bottom:0}
.exprow.warn .expmark{border-color:var(--marigold);color:var(--marigoldDark);background:var(--marigoldS)}
.exprow .nm{font-weight:600;font-size:15px;font-family:"Fraunces","Noto Serif Devanagari",serif}
.exprow .meta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.rmx{background:transparent;border:1px solid var(--line);color:var(--ink2);border-radius:50%;width:24px;height:24px;
  min-height:0;padding:0;font-size:14px;cursor:pointer;line-height:1}

details{border-bottom:1px solid var(--line2);padding:2px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);padding:11px 0;list-style:none;
  display:flex;align-items:center;gap:8px;font-family:"Fraunces","Noto Serif Devanagari",serif}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--marigold);font-size:11px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.urgent{background:var(--rust)} .dot.soon{background:var(--marigold)}
.dot.hold{background:var(--good)} .dot.over{background:var(--line)}
summary .meta2{font-weight:400;font-family:"IBM Plex Sans";font-size:12.5px;color:var(--ink2);margin-left:auto}

.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 14px 19px}
.edit .full{grid-column:1/-1}
label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:3px}
textarea,input,select{font:inherit;font-size:15px;width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink)}

.chips{padding:0 18px}
.chip{display:inline-block;font-size:12.5px;font-weight:500;padding:7px 12px;border:1.5px solid var(--marigold);
  color:var(--marigoldDark);border-radius:16px;margin:0 7px 8px 0;cursor:pointer;background:transparent}
.chip:hover{background:var(--marigoldS)}

.ledgerbox{padding:14px 18px}
.fmt{background:
    repeating-linear-gradient(var(--panel2) 0 27px, var(--line2) 27px 28px);
  border:1px solid var(--line);border-radius:6px;padding:11px 12px;font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:11.5px;margin-bottom:9px;overflow-x:auto;white-space:pre;color:var(--ink2);line-height:28px}
.reg{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:13px;min-height:120px;resize:vertical;
  background:
    repeating-linear-gradient(var(--panel) 0 27px, var(--line2) 27px 28px);
  line-height:28px;padding-top:2px}

footer{font-size:12px;color:var(--ink2);text-align:center;margin:26px 18px 0;padding-top:14px;
  border-top:1px solid var(--line);max-width:52ch;margin-left:auto;margin-right:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
  <div class="mrow">
    <div class="brand">
      <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="17" cy="17" r="15.5" stroke="var(--marigold)" stroke-width="1.4"/>
        <path d="M17 8c5 4.5 5 13 0 18-5-5-5-13.5 0-18z" stroke="var(--brandInk)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M17 12.5v13" stroke="var(--brandInk)" stroke-width="1.2"/>
      </svg>
      <div>
        <h1 id="appName">Dawa <em>Sahayak</em><span class="badge" id="badgeFree"></span></h1>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="mr" aria-pressed="false">मराठी</button>
      <button data-lang="hi" aria-pressed="false">हिंदी</button>
    </div>
  </div>
  <p class="tagline" id="tagline"></p>
</header>

<section>
  <div class="shead"><h2 id="t_order"></h2><div class="sub" id="s_order"></div></div>
  <div class="ledger">
    <div class="inner" id="orderList"></div>
    <div class="totband"><span class="lab" id="t_total"></span><span class="val" id="orderTotal"></span></div>
    <div class="actions"><button class="btn gold wide" id="explainBtn"></button></div>
    <div class="callout" id="explainOut"></div>
  </div>
</section>

<section>
  <div class="shead"><h2 id="t_expiry"></h2><div class="sub" id="s_expiry"></div></div>
  <div class="ledger"><div class="inner" id="expiryList"></div>
    <details style="border-bottom:0">
      <summary id="t_addbatch"></summary>
      <div class="edit">
        <div class="full"><label id="l_med"></label><select id="bMed"></select></div>
        <div><label id="l_qty"></label><input id="bQty" type="number" inputmode="numeric" min="1"></div>
        <div><label id="l_left"></label><input id="bLeft" type="number" inputmode="numeric" min="0" max="24"></div>
        <div class="full"><button class="btn wide" id="addBatch"></button></div>
      </div>
    </details>
  </div>
</section>

<section>
  <div class="shead"><h2 id="t_ask"></h2><div class="sub" id="s_ask"></div></div>
  <div class="chips" id="chips"></div>
  <div class="callout" id="askOut"></div>
</section>

<section>
  <div class="shead"><h2 id="t_import"></h2><div class="sub" id="s_import"></div></div>
  <div class="ledgerbox">
    <div class="fmt" id="fmtHelp"></div>
    <textarea id="raw" class="reg"></textarea>
    <div style="margin-top:10px"><button class="btn wide" id="readBtn"></button></div>
    <div class="callout" id="importOut" style="margin:12px 0 0"></div>
    <div style="margin-top:14px"><button class="btn ghost wide" id="resetBtn"></button></div>
  </div>
</section>

<section>
  <div class="shead"><h2 id="t_shop"></h2><div class="sub" id="s_shop"></div></div>
  <div class="ledger"><div class="inner" id="shopList"></div></div>
</section>

<footer id="foot"></footer>
</div>

/* --------------------------------------------------------------- the maths */
function forecast(sales){
  const s = sales.filter(x=>typeof x === "number" && isFinite(x));
  if(!s.length) return 0;
  if(s.length < 3) return Math.round(s.reduce((a,b)=>a+b,0)/s.length);
  const n = s.length, a = s[n-1], b = s[n-2], c = s[n-3];
  const lvl = 0.5*a + 0.3*b + 0.2*c;
  const tr = 0.5*(a-b) + 0.5*(b-c);
  return Math.max(0, Math.round(lvl + 0.6*tr));
}
function plan(){
  return meds.map(m=>{
    const fc = forecast(m.sales);
    const target = Math.round(fc*MARGIN);
    const gap = target - (m.stock||0);
    const order = gap <= 0 ? 0 : Math.ceil(gap/m.pack)*m.pack;
    const cover = fc > 0 ? (m.stock||0)/fc : 99;
    const state = order > 0 ? (cover < 0.4 ? "urgent" : "soon") : (cover > 2.5 ? "over" : "hold");
    return {m, fc, target, order, cover, state, value: order*m.mrp*0.78, stockValue: (m.stock||0)*m.mrp*0.78};
  });
}
function expiryPlan(){
  return batches.map(b=>{
    const m = meds.find(x=>x.name === b.med);
    if(!m) return null;
    const fc = forecast(m.sales);
    const will = Math.round(fc*b.left);
    const surplus = Math.max(0, b.qty - will);
    const share = b.qty ? surplus/b.qty : 0;
    const rate = surplus > 0 ? TIERS.find(t=>share >= t[0])[1] : 0;
    return {b, m, fc, will, surplus, rate, atRisk: surplus*m.mrp, cost: surplus*m.mrp*rate};
  }).filter(Boolean);
}

/* --------------------------------------------------------- rule-based Q&A */
function explain(){
  const P = plan().sort((a,b)=>a.cover - b.cover);
  const need = P.filter(p=>p.order > 0);
  const out = $("explainOut");
  if(!need.length){ out.textContent = T("a_why_none"); return; }
  const top = need[0];
  out.textContent = fill(T("a_why"), {top: top.m.name, cov: top.cover.toFixed(1), qty: top.order, val: rs(top.value)});
}
function answer(i){
  const out = $("askOut");
  const P = plan();
  if(i === 0){ explain.call(null); const e = $("explainOut").textContent; out.textContent = e; return; }
  if(i === 1){
    const top = [...P].sort((a,b)=>b.stockValue - a.stockValue)[0];
    out.textContent = fill(T("a_money"), {top: top.m.name, units: top.m.stock, val: rs(top.stockValue)});
    return;
  }
  if(i === 2){
    const E = expiryPlan().filter(e=>e.surplus > 0).sort((a,b)=>b.rate - a.rate || b.atRisk - a.atRisk);
    if(!E.length){ out.textContent = T("a_disc_none"); return; }
    const top = E[0];
    out.textContent = fill(T("a_disc"), {top: top.m.name, qty: top.surplus, left: top.b.left, rate: Math.round(top.rate*100), val: rs(top.atRisk)});
    return;
  }
  if(i === 3){
    const urgent = P.filter(p=>p.state === "urgent").map(p=>p.m.name);
    out.textContent = urgent.length ? fill(T("a_short"), {list: urgent.join(", ")}) : T("a_short_none");
    return;
  }
}

/* ---------------------------------------------------------- text importer */
function parseRegister(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = [];
  for(const line of lines){
    if(/^(name|medicine|\u0928\u093e\u0935|\u0914\u0937\u0927)\b/i.test(line)) continue;
    let parts = line.includes("\t") ? line.split("\t") : line.split(/[,;|]/);
    parts = parts.map(p=>p.trim()).filter((p,idx)=> idx===0 ? true : p!=="" || true);
    if(!parts.length || !parts[0]) continue;
    const name = parts[0].replace(/^["']|["']$/g,"");
    if(!/[a-zA-Z\u0900-\u097F]/.test(name)) continue;
    const nums = parts.slice(1).flatMap(p=>String(p).split(/[,\s]+/)).map(Number).filter(x=>isFinite(x));
    if(!nums.length) continue;
    let pack=10, mrp=1, shelf=8, stock=0, sales=[];
    if(nums.length >= 5){
      [pack, mrp, shelf, stock] = nums.slice(0,4);
      sales = nums.slice(4);
    } else if(nums.length === 4){
      [pack, mrp, shelf, stock] = nums; sales = [];
    } else {
      sales = nums;
    }
    if(!sales.length) continue;
    rows.push({
      name: name.slice(0,60),
      pack: Math.max(1, Math.round(pack||10)),
      mrp: Math.max(0.1, mrp||1),
      shelf: Math.max(1, Math.round(shelf||8)),
      stock: Math.max(0, Math.round(stock||0)),
      sales: sales.slice(-12).map(x=>Math.max(0, Math.round(x)))
    });
  }
  return rows;
}
function readRegister(){
  const out = $("importOut");
  out.classList.remove("err");
  const rows = parseRegister($("raw").value);
  if(!rows.length){ out.textContent = T("bad"); out.classList.add("err"); return; }
  meds = rows;
  batches = batches.filter(b=>meds.some(m=>m.name === b.med));
  out.textContent = fill(T("imported"), {n: meds.length});
  $("raw").value = "";
  render();
}

/* ------------------------------------------------------------- controls */
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick = ()=>{
  lang = b.dataset.lang;
  document.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-pressed", String(x === b)));
  render();
});
$("explainBtn").onclick = explain;
$("readBtn").onclick = readRegister;
$("addBatch").onclick = ()=>{
  const med = $("bMed").value, qty = Math.round(Number($("bQty").value)), left = Math.round(Number($("bLeft").value));
  if(!med || !(qty > 0) || !(left >= 0)) return;
  batches.push({med, qty, left});
  $("bQty").value = ""; $("bLeft").value = "";
  save(); render();
};
$("resetBtn").onclick = ()=>{
  meds = JSON.parse(JSON.stringify(SAMPLE)); batches = JSON.parse(JSON.stringify(SAMPLE_BATCHES));
  $("explainOut").textContent = ""; $("askOut").textContent = ""; $("importOut").textContent = "";
  save(); render();
};

load();
document.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));
render();
</script>
</body>
</html>
