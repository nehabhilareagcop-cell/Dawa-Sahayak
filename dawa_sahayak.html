<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawa Sahayak — pharmacy stock assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7ECE6; --panel:#FCFDFB; --panel2:#F1F5F0; --ink:#101F19; --ink2:#4C5E56;
  --line:#CCD7CD; --line2:#DFE7DF;
  --green:#14624A; --greenS:#D8E9DE; --amber:#A8701A; --amberS:#F2E3C2;
  --rust:#9D3527; --rustS:#EFD6D1; --shadow:rgba(16,31,25,.10);
  --hero1:#0F3E30; --hero2:#175443; --on-hero:#EFF6F1; --on-hero-soft:#B9D2C4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1411; --panel:#151E1A; --panel2:#1B2622; --ink:#E2EAE5; --ink2:#93A79D;
    --line:#26332D; --line2:#1F2A25;
    --green:#4FB38C; --greenS:#173026; --amber:#D4A24A; --amberS:#332714;
    --rust:#D9705E; --rustS:#331B17; --shadow:rgba(0,0,0,.4);
    --hero1:#0A211A; --hero2:#0F3226; --on-hero:#E2EAE5; --on-hero-soft:#8AA89A;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1411; --panel:#151E1A; --panel2:#1B2622; --ink:#E2EAE5; --ink2:#93A79D;
  --line:#26332D; --line2:#1F2A25;
  --green:#4FB38C; --greenS:#173026; --amber:#D4A24A; --amberS:#332714;
  --rust:#D9705E; --rustS:#331B17; --shadow:rgba(0,0,0,.4);
  --hero1:#0A211A; --hero2:#0F3226; --on-hero:#E2EAE5; --on-hero-soft:#8AA89A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans Devanagari",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15.5px; line-height:1.55; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 70px}
h1{font-family:Archivo,"Noto Sans Devanagari",sans-serif;font-size:25px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-family:Archivo,"Noto Sans Devanagari",sans-serif;font-size:16.5px;font-weight:600;margin:0 0 2px}
p{margin:.4em 0}
.sub{color:var(--ink2);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--card-accent, var(--line));
     border-radius:9px;padding:17px 17px 16px;margin-bottom:16px;box-shadow:0 1px 2px var(--shadow)}
.card--order{--card-accent:var(--green)}
.card--expiry{--card-accent:var(--rust)}
.card--ask{--card-accent:#3E6E92}
.card--import{--card-accent:var(--amber)}
.card--shop{--card-accent:var(--ink2)}
.card-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}
.card-icon{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--card-icon-bg,var(--panel2));color:var(--card-accent,var(--green))}
.card-icon svg{width:18px;height:18px}
.card--order .card-icon{background:var(--greenS)}
.card--expiry .card-icon{background:var(--rustS)}
.card--ask .card-icon{background:#DEE9F1}
.card--import .card-icon{background:var(--amberS)}
.card--shop .card-icon{background:var(--panel2)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card--ask .card-icon{background:#1B2C36} }
:root[data-theme="dark"] .card--ask .card-icon{background:#1B2C36}

/* ---------------------------------------------------------------- hero */
.hero{
  background:linear-gradient(155deg,var(--hero1),var(--hero2));
  color:var(--on-hero); border-radius:0 0 18px 18px; margin:0 -16px 22px; padding:22px 16px 24px;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero-mark{display:flex;align-items:center;gap:11px}
.hero-mark .mark{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;flex:none}
.hero-mark .mark svg{width:22px;height:22px}
.hero h1{color:var(--on-hero)}
.hero .tagline{color:var(--on-hero-soft);font-size:13.5px;margin-top:6px;max-width:46ch}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;background:transparent;color:var(--ink2);border:0;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);color:#fff}
.hero .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.hero .seg button{color:var(--on-hero-soft)}
.hero .seg button[aria-pressed=true]{background:rgba(255,255,255,.92);color:var(--hero1)}

button{font-family:inherit}
.btn{font:inherit;font-size:14.5px;font-weight:600;padding:11px 16px;border-radius:8px;border:1px solid var(--green);
     background:var(--green);color:#fff;cursor:pointer;min-height:44px;box-shadow:0 1px 2px var(--shadow)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--green);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
textarea,input,select{font:inherit;font-size:15px;width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel2);color:var(--ink)}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:13.5px}
label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:3px;font-weight:500}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:600;font-size:15px}
.row .meta{font-size:12.5px;color:var(--ink2)}
.qty{font-family:Archivo;font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.qty small{display:block;font-family:"IBM Plex Sans";font-weight:500;font-size:11.5px;color:var(--ink2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;margin-right:6px}
.pill.urgent{background:var(--rustS);color:var(--rust)}
.pill.soon{background:var(--panel2);color:var(--ink2)}
.pill.hold{background:var(--greenS);color:var(--green)}
.pill.disc{background:var(--amberS);color:var(--amber)}
.tot{display:flex;justify-content:space-between;font-weight:600;padding-top:12px;margin-top:5px;border-top:1px solid var(--line)}
.ai{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--card-accent,var(--green));
   border-radius:7px;padding:12px 13px;margin-top:12px;white-space:pre-wrap;font-size:14.5px}
.ai:empty{display:none}
.muted{color:var(--ink2);font-size:13px}
.chip{display:inline-block;font-size:12.5px;padding:7px 12px;border:1px solid var(--line);border-radius:16px;margin:4px 6px 0 0;cursor:pointer;background:var(--panel)}
.chip:hover{border-color:var(--card-accent,var(--green));color:var(--card-accent,var(--green))}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--green)}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.edit .full{grid-column:1/-1}
.err{color:var(--rust);font-size:13.5px}
.fmt{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:9px 10px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12px;margin-top:8px;overflow-x:auto;white-space:pre;color:var(--ink2)}
footer{font-size:12px;color:var(--ink2);text-align:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
footer p{margin:.3em 0}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;background:var(--greenS);color:var(--green);margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<div class="hero">
<div class="wrap" style="padding-bottom:0">
<div class="hero-top">
  <div class="hero-mark">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4 4 0 0 1 0-5.6l1.4-1.4a4 4 0 0 1 5.6 0l7 7a4 4 0 0 1 0 5.6l-1.4 1.4a4 4 0 0 1-5.6 0Z"/><path d="m8.5 8.5 7 7"/><path d="M14 2l1.5 1.5M18 4l1.5 1.5M20 8l1.5 1.5"/></svg>
    </span>
    <div>
      <h1 id="appName">Dawa Sahayak<span class="badge" id="badgeFree"></span></h1>
    </div>
  </div>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="true">EN</button>
    <button data-lang="mr" aria-pressed="false">मराठी</button>
    <button data-lang="hi" aria-pressed="false">हिंदी</button>
  </div>
</div>
<div class="tagline" id="tagline"></div>
</div>
</div>
<div class="wrap">

<div class="card card--order">
  <div class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg></span>
    <div>
      <h2 id="t_order"></h2>
      <div class="sub" id="s_order"></div>
    </div>
  </div>
  <div id="orderList"></div>
  <div class="tot"><span id="t_total"></span><span id="orderTotal"></span></div>
  <button class="btn wide ghost" id="explainBtn" style="margin-top:12px"></button>
  <div class="ai" id="explainOut"></div>
</div>

<div class="card card--expiry">
  <div class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 3.2"/></svg></span>
    <div>
      <h2 id="t_expiry"></h2>
      <div class="sub" id="s_expiry"></div>
    </div>
  </div>
  <div id="expiryList"></div>
  <details style="margin-top:10px">
    <summary id="t_addbatch"></summary>
    <div class="edit">
      <div class="full"><label id="l_med"></label><select id="bMed"></select></div>
      <div><label id="l_qty"></label><input id="bQty" type="number" inputmode="numeric" min="1"></div>
      <div><label id="l_left"></label><input id="bLeft" type="number" inputmode="numeric" min="0" max="24"></div>
      <div class="full"><button class="btn wide" id="addBatch"></button></div>
    </div>
  </details>
</div>

<div class="card card--ask">
  <div class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h.01M12 12h.01M16 12h.01"/><path d="M21 12c0 4.4-4 8-9 8-1.3 0-2.5-.2-3.6-.6L3 20l1-4.2C3.4 14.5 3 13.3 3 12c0-4.4 4-8 9-8s9 3.6 9 8Z"/></svg></span>
    <div>
      <h2 id="t_ask"></h2>
      <div class="sub" id="s_ask"></div>
    </div>
  </div>
  <div id="chips"></div>
  <div class="ai" id="askOut"></div>
</div>

<div class="card card--import">
  <div class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
    <div>
      <h2 id="t_import"></h2>
      <div class="sub" id="s_import"></div>
    </div>
  </div>
  <div class="fmt" id="fmtHelp"></div>
  <textarea id="raw" style="margin-top:9px"></textarea>
  <div class="grid3" style="margin-top:9px">
    <button class="btn wide" id="readBtn" style="grid-column:1/-1"></button>
  </div>
  <div class="ai" id="importOut"></div>
  <div style="margin-top:11px"><button class="btn ghost wide" id="resetBtn"></button></div>
</div>

<div class="card card--shop">
  <div class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18M3 9l1.5-5h15L21 9M3 9v9a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M9 13h6"/></svg></span>
    <div>
      <h2 id="t_shop"></h2>
      <div class="sub" id="s_shop"></div>
    </div>
  </div>
  <div id="shopList"></div>
</div>

<footer id="foot"></footer>
</div>

/* --------------------------------------------------------------- the maths */
function forecast(sales){
  const s = sales.filter(x=>typeof x === "number" && isFinite(x));
  if(!s.length) return 0;
  if(s.length < 3) return Math.round(s.reduce((a,b)=>a+b,0)/s.length);
  const n = s.length, a = s[n-1], b = s[n-2], c = s[n-3];
  const lvl = 0.5*a + 0.3*b + 0.2*c;
  const tr = 0.5*(a-b) + 0.5*(b-c);
  return Math.max(0, Math.round(lvl + 0.6*tr));
}
function plan(){
  return meds.map(m=>{
    const fc = forecast(m.sales);
    const target = Math.round(fc*MARGIN);
    const gap = target - (m.stock||0);
    const order = gap <= 0 ? 0 : Math.ceil(gap/m.pack)*m.pack;
    const cover = fc > 0 ? (m.stock||0)/fc : 99;
    const state = order > 0 ? (cover < 0.4 ? "urgent" : "soon") : (cover > 2.5 ? "over" : "hold");
    return {m, fc, target, order, cover, state, value: order*m.mrp*0.78, stockValue: (m.stock||0)*m.mrp*0.78};
  });
}
function expiryPlan(){
  return batches.map(b=>{
    const m = meds.find(x=>x.name === b.med);
    if(!m) return null;
    const fc = forecast(m.sales);
    const will = Math.round(fc*b.left);
    const surplus = Math.max(0, b.qty - will);
    const share = b.qty ? surplus/b.qty : 0;
    const rate = surplus > 0 ? TIERS.find(t=>share >= t[0])[1] : 0;
    return {b, m, fc, will, surplus, rate, atRisk: surplus*m.mrp, cost: surplus*m.mrp*rate};
  }).filter(Boolean);
}

/* --------------------------------------------------------- rule-based Q&A */
function explain(){
  const P = plan().sort((a,b)=>a.cover - b.cover);
  const need = P.filter(p=>p.order > 0);
  const out = $("explainOut");
  if(!need.length){ out.textContent = T("a_why_none"); return; }
  const top = need[0];
  out.textContent = fill(T("a_why"), {top: top.m.name, cov: top.cover.toFixed(1), qty: top.order, val: rs(top.value)});
}
function answer(i){
  const out = $("askOut");
  const P = plan();
  if(i === 0){ explain(); return; }
  if(i === 1){
    const top = [...P].sort((a,b)=>b.stockValue - a.stockValue)[0];
    out.textContent = fill(T("a_money"), {top: top.m.name, units: top.m.stock, val: rs(top.stockValue)});
    return;
  }
  if(i === 2){
    const E = expiryPlan().filter(e=>e.surplus > 0).sort((a,b)=>b.rate - a.rate || b.atRisk - a.atRisk);
    if(!E.length){ out.textContent = T("a_disc_none"); return; }
    const top = E[0];
    out.textContent = fill(T("a_disc"), {top: top.m.name, qty: top.surplus, left: top.b.left, rate: Math.round(top.rate*100), val: rs(top.atRisk)});
    return;
  }
  if(i === 3){
    const urgent = P.filter(p=>p.state === "urgent").map(p=>p.m.name);
    out.textContent = urgent.length ? fill(T("a_short"), {list: urgent.join(", ")}) : T("a_short_none");
    return;
  }
}

// lines are skipped. Missing numeric fields fall back to sensible defaults.
function parseRegister(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = [];
  for(const line of lines){
    if(/^(name|medicine|\u0928\u093e\u0935|\u0914\u0937\u0927)\b/i.test(line)) continue; // header row
    let parts = line.includes("\t") ? line.split("\t") : line.split(/[,;|]/);
    parts = parts.map(p=>p.trim()).filter((p,idx)=> idx===0 ? true : p!=="" || true);
    if(!parts.length || !parts[0]) continue;
    const name = parts[0].replace(/^["']|["']$/g,"");
    if(!/[a-zA-Z\u0900-\u097F]/.test(name)) continue;
    const nums = parts.slice(1).flatMap(p=>String(p).split(/[,\s]+/)).map(Number).filter(x=>isFinite(x));
    if(!nums.length) continue;
    let pack=10, mrp=1, shelf=8, stock=0, sales=[];
    if(nums.length >= 5){
      [pack, mrp, shelf, stock] = nums.slice(0,4);
      sales = nums.slice(4);
    } else if(nums.length === 4){
      [pack, mrp, shelf, stock] = nums; sales = [];
    } else {
      sales = nums; // just a run of monthly figures after the name
    }
    if(!sales.length) continue;
    rows.push({
      name: name.slice(0,60),
      pack: Math.max(1, Math.round(pack||10)),
      mrp: Math.max(0.1, mrp||1),
      shelf: Math.max(1, Math.round(shelf||8)),
      stock: Math.max(0, Math.round(stock||0)),
      sales: sales.slice(-12).map(x=>Math.max(0, Math.round(x)))
    });
  }
  return rows;
}
function readRegister(){
  const out = $("importOut");
  out.classList.remove("err");
  const rows = parseRegister($("raw").value);
  if(!rows.length){ out.textContent = T("bad"); out.classList.add("err"); return; }
  meds = rows;
  batches = batches.filter(b=>meds.some(m=>m.name === b.med));
  out.textContent = fill(T("imported"), {n: meds.length});
  $("raw").value = "";
  render();
}

/* ------------------------------------------------------------- controls */
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick = ()=>{
  lang = b.dataset.lang;
  document.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-pressed", String(x === b)));
  render();
});
$("explainBtn").onclick = explain;
$("readBtn").onclick = readRegister;
$("addBatch").onclick = ()=>{
  const med = $("bMed").value, qty = Math.round(Number($("bQty").value)), left = Math.round(Number($("bLeft").value));
  if(!med || !(qty > 0) || !(left >= 0)) return;
  batches.push({med, qty, left});
  $("bQty").value = ""; $("bLeft").value = "";
  save(); render();
};
$("resetBtn").onclick = ()=>{
  meds = JSON.parse(JSON.stringify(SAMPLE)); batches = JSON.parse(JSON.stringify(SAMPLE_BATCHES));
  $("explainOut").textContent = ""; $("askOut").textContent = ""; $("importOut").textContent = "";
  save(); render();
};

load();
document.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));
render();
</script>
